spring:
  application:
    name: fastfood-pagamentos-ms

  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/fastfood_pagamentos?createDatabaseIfNotExist=true
      username: root
      password: root

  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

server:
  port: 0

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.int}
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


resilience4j:
  circuitbreaker:
    instances:
      pagamento-confirmarPagamento:
        sliding-window-size: 3
        minimum-number-of-calls: 2
        wait-duration-in-open-state: 50s
